name: Pre-release CI

# CodeQL default setup supplies the required scan for PRs targeting either
# protected branch alongside these repository-specific release checks.
on:
  pull_request:
    branches: ["main", "develop"]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "appcast.xml"
      - "site/appcast.xml"

permissions:
  contents: read

jobs:
  preflight:
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    timeout-minutes: 45
    concurrency:
      group: pre-release-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          SERVER_HOST="${SERVER_URL#https://}"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${REPO}.git"
          git fetch --depth=1 origin "$REF"
          git checkout FETCH_HEAD

      - name: Verify Xcode 27 SDK family
        env:
          NVE_ALLOW_BETA_XCODE: 1
        run: |
          set -euo pipefail
          source scripts/ci/select_xcode17.sh
          require_xcode_major 27
          require_sdk_major 27 macosx iphoneos iphonesimulator xros
          xcodebuild -version

      - name: Validate basic release docs format
        run: |
          set -euo pipefail
          if grep -nE "^- TODO$" CHANGELOG.md >/dev/null; then
            echo "CHANGELOG contains TODO entries. Fill release notes before merging." >&2
            exit 1
          fi
          grep -nE "^> Latest release: \\*\\*v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.]+)?\\*\\*$" README.md >/dev/null
          grep -nE "^- Latest release: \\*\\*v[0-9]+\\.[0-9]+\\.[0-9]+(-[A-Za-z0-9.]+)?\\*\\*$" README.md >/dev/null

      - name: Verify performance budget contract
        run: python3 scripts/ci/check_performance_budget.py

      - name: Verify release workflow regressions offline
        run: |
          python3 -m venv "$RUNNER_TEMP/nve-release-tests"
          "$RUNNER_TEMP/nve-release-tests/bin/python" -m pip install 'cryptography==50.0.1'
          "$RUNNER_TEMP/nve-release-tests/bin/python" scripts/ci/test_release_workflow.py

      - name: Run critical runtime tests
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          xcodebuild \
            -project "Neon Vision Editor.xcodeproj" \
            -scheme "Neon Vision Editor" \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            MACOSX_DEPLOYMENT_TARGET=15.5 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:"Neon Vision EditorTests/ReleaseRuntimePolicyTests" \
            -only-testing:"Neon Vision EditorTests/AppDelegateExternalOpenTests" \
            test

      - name: Record virtual editor performance trends
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
          RESULT_BUNDLE: ${{ runner.temp }}/VirtualEditorPerformance.xcresult
        run: |
          set -euo pipefail
          xcodebuild \
            -project "Neon Vision Editor.xcodeproj" \
            -scheme "Neon Vision Editor" \
            -destination "platform=macOS" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RESULT_BUNDLE" \
            MACOSX_DEPLOYMENT_TARGET=15.5 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -only-testing:"Neon Vision EditorTests/VirtualEditorPerformanceTests" \
            test

      - name: Upload virtual editor performance results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: virtual-editor-performance-${{ github.run_id }}
          path: ${{ runner.temp }}/VirtualEditorPerformance.xcresult
          if-no-files-found: warn
          retention-days: 30

      - name: Verify icon payload in built app
        env:
          DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: |
          set -euo pipefail
          APP="$DERIVED_DATA/Build/Products/Debug/Neon Vision Editor.app"
          scripts/ci/verify_icon_payload.sh "$APP"
