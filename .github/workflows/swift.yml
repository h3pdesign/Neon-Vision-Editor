# Builds the Xcode project across macOS, iOS Simulator, and iPad Simulator.

name: Swift

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main", "develop" ]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - site/**
      - appcast.xml
      - docs/**
      - release/**

permissions:
  contents: read

jobs:
  build:
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    # The agentic editor uses the macOS 27 Foundation Models APIs and must be
    # compiled with the Xcode 17+ SDK rather than the legacy macos-latest image.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Select Xcode 17+
        run: |
          set -euo pipefail
          source scripts/ci/select_xcode17.sh
          xcodebuild -version

      - name: Build platform matrix
        run: scripts/ci/build_platform_matrix.sh

  macos_sequoia_syntax_regressions:
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    name: macOS Sequoia syntax regressions
    runs-on: macos-15

    steps:
      - name: Checkout repository
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          SERVER_HOST="${SERVER_URL#https://}"
          git init
          git remote add origin "https://x-access-token:${GH_TOKEN}@${SERVER_HOST}/${REPO}.git"
          git fetch --depth=1 origin "$REF"
          git checkout FETCH_HEAD

      - name: Run macOS syntax highlighting regressions
        run: |
          set -euo pipefail
          swiftc \
            "Neon Vision Editor/Core/NVELock.swift" \
            "Neon Vision Editor/Core/SyntaxHighlighting.swift" \
            "Neon Vision Editor/Core/HTMLSyntaxHighlighting.swift" \
            "Neon Vision Editor/UI/EditorTextView+RuntimePolicy.swift" \
            scripts/ci/run_syntax_highlighting_regressions.swift \
            -o "$RUNNER_TEMP/syntax-highlighting-regressions"
          "$RUNNER_TEMP/syntax-highlighting-regressions"
