name: Sync README App Store Versions

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to sync, e.g. v0.8.9"
        required: false
      store_version:
        description: "Optional App Store version override for manual repair"
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for App Store propagation
        if: github.event_name == 'release'
        run: sleep 3600

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Keep signed documentation sync commits attributable to the
          # repository automation identity that may bypass protected main.
          token: ${{ secrets.METRIC_TOKEN }}

      - name: Prepare automation branch
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-manual}"
          tag="${tag#v}"
          branch="automation/appstore-version-${tag}"
          git fetch origin main
          git fetch origin "${branch}" || true
          git checkout -B "${branch}" origin/main
          echo "SYNC_BRANCH=${branch}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Sync README App Store versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          STORE_VERSION: ${{ inputs.store_version }}
        run: |
          set -euo pipefail

          args=()
          if [ -n "${RELEASE_TAG:-}" ]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          if [ -n "${STORE_VERSION:-}" ]; then
            args+=(--store-version "$STORE_VERSION")
          fi

          scripts/sync_readme_appstore_versions.py "${args[@]}"

      - name: Configure signed commits (SSH)
        env:
          METRICS_SIGNING_SSH_KEY: ${{ secrets.METRICS_SIGNING_SSH_KEY }}
          METRICS_SIGNING_NAME: ${{ secrets.METRICS_SIGNING_NAME }}
          METRICS_SIGNING_EMAIL: ${{ secrets.METRICS_SIGNING_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${METRICS_SIGNING_SSH_KEY:-}" ]; then
            echo "Missing secret: METRICS_SIGNING_SSH_KEY"
            echo "Refusing to create unsigned README App Store sync commits."
            exit 1
          fi

          SIGNING_KEY_PATH="$RUNNER_TEMP/readme_appstore_signing_ssh_key"
          SIGNING_PUB_KEY_PATH="$RUNNER_TEMP/readme_appstore_signing_ssh_key.pub"
          if printf '%s' "$METRICS_SIGNING_SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$METRICS_SIGNING_SSH_KEY" > "$SIGNING_KEY_PATH"
          else
            printf '%s' "$METRICS_SIGNING_SSH_KEY" | base64 -d > "$SIGNING_KEY_PATH"
          fi
          perl -pi -e 's/\r$//' "$SIGNING_KEY_PATH"
          chmod 600 "$SIGNING_KEY_PATH"
          ssh-keygen -y -f "$SIGNING_KEY_PATH" > "$SIGNING_PUB_KEY_PATH"

          git config user.name "${METRICS_SIGNING_NAME:-h3p}"
          git config user.email "${METRICS_SIGNING_EMAIL:-apps@hpedersen.de}"
          git config gpg.format ssh
          git config user.signingkey "$SIGNING_PUB_KEY_PATH"
          git config commit.gpgsign true

      - name: Commit and update pull request if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if git diff --quiet README.md site/index.html; then
            echo "No README or website App Store version changes."
            exit 0
          fi

          git add README.md site/index.html
          git commit -S -m "docs: sync App Store versions"

          git push --force-with-lease origin "HEAD:${SYNC_BRANCH}"
          sync_sha="$(git rev-parse HEAD)"
          sync_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main --head "${SYNC_BRANCH}" \
            --json number,headRefOid --jq ".[] | select(.headRefOid == \"${sync_sha}\") | .number" | head -n1)"
          if [[ -z "${sync_pr}" ]]; then
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${SYNC_BRANCH}" \
              --title "docs: sync App Store versions" \
              --body "Automated App Store version synchronization after release."
            sync_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base main --head "${SYNC_BRANCH}" \
              --json number,headRefOid --jq ".[] | select(.headRefOid == \"${sync_sha}\") | .number" | head -n1)"
          fi
          if [[ -z "${sync_pr}" ]]; then
            echo "Could not resolve the open App Store synchronization PR for ${sync_sha}." >&2
            exit 1
          fi
          gh pr merge "${sync_pr}" --repo "${GITHUB_REPOSITORY}" --auto --merge --delete-branch || \
            echo "Auto-merge is unavailable; leaving the App Store synchronization PR open."
