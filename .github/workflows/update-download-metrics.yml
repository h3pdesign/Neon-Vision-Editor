name: Update Download & Traffic Metrics

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: daily-metrics
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Protected main does not permit the default github-actions[bot]
          # token to bypass PR and CodeQL requirements. This existing repository
          # token belongs to the signed metrics automation identity instead.
          token: ${{ secrets.METRIC_TOKEN }}

      - name: Prepare metrics branch
        run: |
          set -euo pipefail
          git fetch origin main
          git fetch origin automation/daily-metrics || true
          git checkout -B automation/daily-metrics origin/main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Update README metrics and traffic chart
        env:
          GH_TOKEN: ${{ secrets.METRIC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update_download_metrics.py --require-traffic-api

      - name: Configure signed commits (SSH)
        env:
          METRICS_SIGNING_SSH_KEY: ${{ secrets.METRICS_SIGNING_SSH_KEY }}
          METRICS_SIGNING_NAME: ${{ secrets.METRICS_SIGNING_NAME }}
          METRICS_SIGNING_EMAIL: ${{ secrets.METRICS_SIGNING_EMAIL }}
        run: |
          set -euo pipefail

          if [ -z "${METRICS_SIGNING_SSH_KEY:-}" ]; then
            echo "Missing secret: METRICS_SIGNING_SSH_KEY"
            echo "Refusing to create unsigned metrics commits."
            exit 1
          fi

          SIGNING_KEY_PATH="$RUNNER_TEMP/metrics_signing_ssh_key"
          SIGNING_PUB_KEY_PATH="$RUNNER_TEMP/metrics_signing_ssh_key.pub"
          if printf '%s' "$METRICS_SIGNING_SSH_KEY" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$METRICS_SIGNING_SSH_KEY" > "$SIGNING_KEY_PATH"
          else
            printf '%s' "$METRICS_SIGNING_SSH_KEY" | base64 -d > "$SIGNING_KEY_PATH"
          fi
          perl -pi -e 's/\r$//' "$SIGNING_KEY_PATH"
          chmod 600 "$SIGNING_KEY_PATH"
          ssh-keygen -y -f "$SIGNING_KEY_PATH" > "$SIGNING_PUB_KEY_PATH"

          git config user.name "${METRICS_SIGNING_NAME:-h3p}"
          git config user.email "${METRICS_SIGNING_EMAIL:-apps@hpedersen.de}"
          git config gpg.format ssh
          git config user.signingkey "$SIGNING_PUB_KEY_PATH"
          git config commit.gpgsign true

      - name: Commit and update metrics pull request
        env:
          GH_TOKEN: ${{ github.token }}
          METRICS_BRANCH: automation/daily-metrics
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No metrics changes."
            metrics_pr="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${METRICS_BRANCH}" --json number --jq '.[0].number // empty')"
            if [ -n "${metrics_pr}" ]; then
              gh pr close "${metrics_pr}" --repo "${GITHUB_REPOSITORY}" --delete-branch
            elif git ls-remote --exit-code --heads origin "${METRICS_BRANCH}" >/dev/null 2>&1; then
              git push origin --delete "${METRICS_BRANCH}"
            fi
            exit 0
          fi

          git add README.md docs/images/release-download-trend*.svg
          git commit -S -m "docs: refresh download metrics chart"
          git push --force-with-lease origin "HEAD:${METRICS_BRANCH}"

          if gh pr view "${METRICS_BRANCH}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Updated existing metrics pull request."
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${METRICS_BRANCH}" \
              --title "docs: refresh daily download metrics" \
              --body "Automated refresh of README download and traffic metrics."
          fi

          if ! gh pr merge "${METRICS_BRANCH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --merge \
            --delete-branch; then
            gh pr merge "${METRICS_BRANCH}" \
              --repo "${GITHUB_REPOSITORY}" \
              --auto \
              --merge \
              --delete-branch || echo "Auto-merge is unavailable; leaving the metrics pull request open."
          fi
