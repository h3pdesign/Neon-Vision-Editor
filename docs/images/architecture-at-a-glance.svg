<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Neon Vision Editor architecture at a glance</title>
  <desc id="desc">Platform shells feed scene presentation and per-window document ownership. Native editors, previews, project services, AI, and external file observation connect to the document model. Release policy separates App Store and direct macOS distribution.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,3 L0,6 Z" fill="#94a3b8"/></marker>
    <style>.bg{fill:#0d1117}.group{fill:#161d27;stroke:#334155;stroke-width:2}.title{fill:#f8fafc;font:700 26px -apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}.label{fill:#cbd5e1;font:600 14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.body{fill:#e2e8f0;font:14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.small{fill:#94a3b8;font:12px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.box{rx:10;stroke-width:2}.platform{fill:#172554;stroke:#3b82f6}.app{fill:#052e2b;stroke:#10b981}.core{fill:#431407;stroke:#f97316}.infra{fill:#2e1065;stroke:#a855f7}.dist{fill:#500724;stroke:#ec4899}.edge{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text class="title" x="56" y="58">Neon Vision Editor — Architecture At A Glance</text>
  <text class="small" x="56" y="84">Stable v1.6.3 · arrows show ownership or data exchange, not thread guarantees</text>
  <rect class="group" x="40" y="110" width="1320" height="170" rx="14"/><text class="label" x="64" y="138">PLATFORM AND SCENE PRESENTATION</text>
  <rect class="box platform" x="70" y="164" width="230" height="78"/><text class="body" x="185" y="194" text-anchor="middle">macOS SwiftUI + AppKit</text><text class="small" x="185" y="216" text-anchor="middle">native menus and windows</text>
  <rect class="box platform" x="335" y="164" width="260" height="78"/><text class="body" x="465" y="194" text-anchor="middle">iPhone / iPad / visionOS</text><text class="small" x="465" y="216" text-anchor="middle">SwiftUI + UIKit text surface</text>
  <rect class="box platform" x="650" y="164" width="300" height="78"/><text class="body" x="800" y="194" text-anchor="middle">ContentView</text><text class="small" x="800" y="216" text-anchor="middle">panes · focus · selection · commands</text>
  <rect class="box platform" x="1005" y="164" width="300" height="78"/><text class="body" x="1155" y="194" text-anchor="middle">ReleaseRuntimePolicy</text><text class="small" x="1155" y="216" text-anchor="middle">platform and distribution gates</text>
  <rect class="group" x="40" y="320" width="620" height="250" rx="14"/><text class="label" x="64" y="348">PER-WINDOW DOCUMENT OWNERSHIP</text>
  <rect class="box app" x="70" y="376" width="250" height="78"/><text class="body" x="195" y="406" text-anchor="middle">EditorViewModel</text><text class="small" x="195" y="428" text-anchor="middle">load · save · refresh · conflicts</text>
  <rect class="box app" x="350" y="376" width="250" height="78"/><text class="body" x="475" y="406" text-anchor="middle">TabCommandQueue + TabData</text><text class="small" x="475" y="428" text-anchor="middle">stable IDs · revisions · indexes</text>
  <rect class="box core" x="70" y="478" width="250" height="64"/><text class="body" x="195" y="506" text-anchor="middle">EditorDocument</text><text class="small" x="195" y="526" text-anchor="middle">bounded read/edit contract</text>
  <rect class="box core" x="350" y="478" width="250" height="64"/><text class="body" x="475" y="506" text-anchor="middle">FileBackedTextDocument</text><text class="small" x="475" y="526" text-anchor="middle">disk ranges + replacement pieces</text>
  <rect class="group" x="700" y="320" width="660" height="250" rx="14"/><text class="label" x="724" y="348">NATIVE EDITING, PREVIEW, AND FAST ACTIVATION</text>
  <rect class="box core" x="730" y="376" width="280" height="78"/><text class="body" x="870" y="406" text-anchor="middle">VirtualEditorView</text><text class="small" x="870" y="428" text-anchor="middle">Core Text bounded viewport · first frame</text>
  <rect class="box core" x="1040" y="376" width="280" height="78"/><text class="body" x="1180" y="406" text-anchor="middle">CustomTextEditor</text><text class="small" x="1180" y="428" text-anchor="middle">UITextView on iOS/iPadOS/visionOS</text>
  <rect class="box core" x="730" y="478" width="280" height="64"/><text class="body" x="870" y="506" text-anchor="middle">Syntax · Emmet · completion</text><text class="small" x="870" y="526" text-anchor="middle">generation-checked, bounded work</text>
  <rect class="box core" x="1040" y="478" width="280" height="64"/><text class="body" x="1180" y="506" text-anchor="middle">Markdown / HTML / SVG / PDF</text><text class="small" x="1180" y="526" text-anchor="middle">debounced preview and paginated export</text>
  <rect class="group" x="40" y="610" width="1320" height="210" rx="14"/><text class="label" x="64" y="638">OPTIONAL SERVICES AND EXTERNAL BOUNDARIES</text>
  <rect class="box core" x="70" y="666" width="240" height="72"/><text class="body" x="190" y="694" text-anchor="middle">OpenDocumentObservationCenter</text><text class="small" x="190" y="716" text-anchor="middle">NSFilePresenter + metadata polling</text>
  <rect class="box core" x="350" y="666" width="240" height="72"/><text class="body" x="470" y="694" text-anchor="middle">Project index and search</text><text class="small" x="470" y="716" text-anchor="middle">.gitignore + ignored folders</text>
  <rect class="box infra" x="630" y="666" width="240" height="72"/><text class="body" x="750" y="694" text-anchor="middle">AI Chat and providers</text><text class="small" x="750" y="716" text-anchor="middle">explicit context · Keychain</text>
  <rect class="box infra" x="910" y="666" width="240" height="72"/><text class="body" x="1030" y="694" text-anchor="middle">Recovery and annotations</text><text class="small" x="1030" y="716" text-anchor="middle">drafts · PDF notes · preferences</text>
  <rect class="box dist" x="1190" y="666" width="130" height="72"/><text class="body" x="1255" y="694" text-anchor="middle">Distribution</text><text class="small" x="1255" y="716" text-anchor="middle">App Store / Sparkle</text>
  <path class="edge" d="M300 203 H650"/><path class="edge" d="M595 203 H650"/><path class="edge" d="M800 242 V376 H320"/><path class="edge" d="M800 242 V376 H730"/><path class="edge" d="M320 415 H350"/><path class="edge" d="M195 454 V478"/><path class="edge" d="M475 454 V478"/><path class="edge" d="M600 510 H730"/><path class="edge" d="M1010 415 H1040"/><path class="edge" d="M800 242 V666 H310"/><path class="edge" d="M800 242 V666 H630"/><path class="edge" d="M1155 242 V666 H1190"/>
  <text class="small" x="64" y="862">Fast tab activation: select → bind existing bounded viewport → draw first frame; layout, preview, indexing, and metadata work are cancellable and deferred.</text>
</svg>
